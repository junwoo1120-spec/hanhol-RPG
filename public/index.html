<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Open World</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #a8c8e8; font-family: sans-serif; }
  #login { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
           align-items: center; justify-content: center; background: #1b2a3a; color: #fff; z-index: 10; }
  #login input, #login button { font-size: 18px; padding: 8px 14px; }
  #hud { position: fixed; top: 8px; left: 8px; color: #fff; font-size: 13px;
         text-shadow: 0 0 3px #000; white-space: pre; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="login">
  <h2>오픈월드</h2>
  <input id="nick" maxlength="12" placeholder="닉네임">
  <button id="join">입장</button>
  <div id="msg"></div>
</div>
<div id="hud"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
